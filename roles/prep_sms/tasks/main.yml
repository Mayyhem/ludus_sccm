---
- name: Install Windows Features
  ansible.windows.win_feature:
    name:
      - BITS
      - BITS-IIS-Ext
      - GPMC
      - NET-Framework-Core
      - NET-Framework-45-Core
      - RDC
      - RSAT
      - Web-WebServer
      - Web-Common-Http
      - Web-Dir-Browsing
      - Web-Http-Errors
      - Web-Static-Content
      - Web-Default-Doc
      - Web-Http-Redirect
      - Web-Mgmt-Tools
      - Web-Mgmt-Console
      - Web-Mgmt-Compat
      - Web-Metabase
      - Web-WMI
      - Web-Windows-Auth
      - Web-ISAPI-Ext
      - Web-Scripting-Tools
      - Web-Mgmt-Service
    state: present

- name: Prepare the SMS Provider prerequisites
  ansible.builtin.include_role:
    name: mayyhem.ludus_sccm.prepare_sccm
    public: true
  vars:
    ludus_sccm_prepare_adk: true
