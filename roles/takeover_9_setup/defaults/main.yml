---
ludus_install_directory: /opt/ludus
ludus_sccm_host_path: "C:\\ludus\\sccm"
ludus_sccm_sql2022_url: https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU.iso

# Which SCCM site database this third-party SQL will link back into.
# The VM's ansible inventory hostname (short) — the role delegates to
# this host to enable Mixed Mode auth and create the SA-privileged
# SQL login.
ludus_sccm_takeover9_target_vm_name: ps1-db

# FQDN of the same site database, used as the data source in
# sp_addlinkedserver. Defaults to <vm>.<domain>.
ludus_sccm_takeover9_target_fqdn: "{{ ludus_sccm_takeover9_target_vm_name }}.{{ ludus_domain_fqdn }}"

# Name of the linked server as it will appear in sys.servers on the
# third-party host. The MM description uses SCCMSITEDB — kept for
# consistency.
ludus_sccm_takeover9_link_name: SCCMSITEDB

# The SA-privileged SQL login that the linked server will store as a
# fixed credential and that the role creates on the target site DB.
# This is the payload of the misconfiguration.
ludus_sccm_takeover9_sql_login: sccm_link
ludus_sccm_takeover9_sql_password: 'Password123'

# SQL Server 2022 registry key for the default instance. Keep an override
# if a future collection version pins a different instance name.
ludus_sccm_takeover9_sql_regpath: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQLServer'
