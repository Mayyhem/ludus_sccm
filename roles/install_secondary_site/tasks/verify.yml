---
- name: Load the shared readiness checks
  ansible.builtin.include_role:
    name: mayyhem.ludus_sccm.sccm_common
    public: true

- name: Wait for actual secondary-site readiness after submission
  ansible.windows.win_powershell:
    script: |
      param([string]$Directory, [string]$Parent, [string]$Code, [string]$Server)
      Import-Module "$Directory\SccmDeployment.psm1" -Force
      Set-SccmLog "$Directory\secondary-readiness.log"
      Wait-SccmSiteReady -Provider $env:COMPUTERNAME -ParentSiteCode $Parent -SiteCode $Code -Server $Server
      $Ansible.Changed = $false
    parameters:
      Directory: "{{ ludus_sccm_work_directory }}"
      Parent: "{{ ludus_sccm_sitecode }}"
      Code: "{{ ludus_sccm_secondary_sitecode }}"
      Server: "{{ ludus_sccm_secondary_siteserver_fqdn }}"
  async: 14400
  poll: 30
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: '{{ ludus_domain_netbios_name }}\{{ defaults.ad_domain_admin }}'
    ansible_become_password: '{{ defaults.ad_domain_admin_password }}'
    # Background (async) runs must not load the profile: since the November 2026
    # Windows update the loaded hive is unloaded once the become launcher exits,
    # so Start-Process and HKCU access fail (registry key marked for deletion).
    ansible_become_flags: logon_type=interactive logon_flags=
  when: not ansible_check_mode

- name: Keep the installed secondary database and model at supported compatibility
  ansible.windows.win_powershell:
    script: |
      param([string]$Directory, [string]$Parent, [string]$Code)
      Import-Module "$Directory\SccmDeployment.psm1" -Force
      Set-SccmLog "$Directory\secondary-readiness.log"
      $definitions = @(Get-SccmProviderData $env:COMPUTERNAME $Parent 'SMS_SCI_SiteDefinition' "SiteCode='$Code'")
      if ($definitions.Count -ne 1) { Stop-SccmWork "No unique database definition exists for secondary $Code." }
      $database = Get-SccmDatabaseLocation $definitions[0]
      $before = Invoke-SccmSqlQuery $database.Server "SELECT COUNT(*) AS NeedsChange FROM sys.databases WHERE (name = 'model' OR name LIKE 'CM[_]%') AND compatibility_level > 150"
      Set-SccmSqlCompatibility -Server $database.Server -IncludeModel
      $Ansible.Changed = [int]$before.Rows[0].NeedsChange -gt 0
    parameters:
      Directory: "{{ ludus_sccm_work_directory }}"
      Parent: "{{ ludus_sccm_sitecode }}"
      Code: "{{ ludus_sccm_secondary_sitecode }}"
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: '{{ ludus_domain_netbios_name }}\{{ defaults.ad_domain_admin }}'
    ansible_become_password: '{{ defaults.ad_domain_admin_password }}'
    ansible_become_flags: logon_type=interactive logon_flags=with_profile
  when: not ansible_check_mode
