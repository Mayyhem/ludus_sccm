---
- name: Match the servicing console to the currently installed root
  ansible.builtin.include_tasks: console.yml
- name: "Service CAS and primary sites to SCCM {{ sccm_release }}"
  ansible.builtin.include_role:
    name: mayyhem.ludus_sccm.sccm_common
    tasks_from: run_phase.yml
    public: true
  vars:
    sccm_phase_name: "Service CAS and primary sites to SCCM {{ sccm_release }}"
    sccm_phase_script: Update-SccmRelease.ps1
    sccm_phase_arguments:
      SiteCode: "{{ ludus_sccm_sitecode }}"
      TargetRelease: "{{ sccm_release }}"
      TargetBuild: "{{ ludus_sccm_selected_deployment.release_builds[sccm_release] | int }}"
      AllowWarnings: "{{ ludus_sccm_allow_prerequisite_warnings | bool }}"
      TimeoutMinutes: "{{ ludus_sccm_update_timeout_minutes | int }}"
      ParentsOnly: true
- name: Match the servicing console to the newly installed root
  ansible.builtin.include_tasks: console.yml
- name: "Reconcile secondary and passive servers after SCCM {{ sccm_release }}"
  ansible.builtin.include_role:
    name: mayyhem.ludus_sccm.sccm_common
    tasks_from: run_phase.yml
    public: true
  vars:
    sccm_phase_name: "Reconcile secondary and passive servers after SCCM {{ sccm_release }}"
    sccm_phase_script: Update-SccmRelease.ps1
    sccm_phase_arguments:
      SiteCode: "{{ ludus_sccm_sitecode }}"
      TargetRelease: "{{ sccm_release }}"
      TargetBuild: "{{ ludus_sccm_selected_deployment.release_builds[sccm_release] | int }}"
      AllowWarnings: "{{ ludus_sccm_allow_prerequisite_warnings | bool }}"
      TimeoutMinutes: "{{ ludus_sccm_update_timeout_minutes | int }}"
