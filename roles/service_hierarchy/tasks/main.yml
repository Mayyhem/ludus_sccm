---
- name: Load the shared deployment selection and helpers
  ansible.builtin.include_role:
    name: mayyhem.ludus_sccm.sccm_common
    public: true
- name: Explain servicing in check mode
  ansible.builtin.debug:
    msg: Resolved {{ ludus_sccm_selected_plan.target_version }}. Hierarchy servicing and live verification are skipped
      in check mode.
  when: ansible_check_mode
- name: Service and verify the hierarchy from its top-level site server
  when: not ansible_check_mode
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: '{{ ludus_domain_netbios_name }}\{{ defaults.ad_domain_admin }}'
    ansible_become_password: '{{ defaults.ad_domain_admin_password }}'
    ansible_become_flags: logon_type=interactive logon_flags=with_profile
  block:
  - name: Copy the hierarchy servicing scripts
    ansible.windows.win_copy:
      src: '{{ item }}'
      dest: '{{ ludus_sccm_work_directory }}\{{ item }}'
    loop:
    - Update-SccmRelease.ps1
    - Update-SccmHotfixes.ps1
    - Complete-SccmDeployment.ps1
  - name: Read the actual installed site versions
    ansible.windows.win_powershell:
      script: "param([string]$Directory, [string]$Code)\nImport-Module \"$Directory\\SccmDeployment.psm1\" -Force\n\
        Set-SccmLog \"$Directory\\hierarchy-update.log\"\n$versions = @{}\nforeach ($site in @(Get-SccmProviderData\
        \ $env:COMPUTERNAME $Code 'SMS_Site')) {\n    $versions[[string]$site.SiteCode] = [string]$site.Version\n\
        }\nif (-not $versions.Count) { Stop-SccmWork 'The provider returned no installed sites.' }\n$Ansible.Changed\
        \ = $false\n$Ansible.Result = $versions\n"
      parameters:
        Directory: '{{ ludus_sccm_work_directory }}'
        Code: '{{ ludus_sccm_sitecode }}'
    register: ludus_sccm_installed_sites
  - name: Match the servicing console before any site management cmdlet runs
    ansible.builtin.include_tasks: console.yml
  - name: Enable requested Configuration Manager generated HTTP certificates per site
    ansible.windows.win_powershell:
      script: "param([string]$Directory, [string]$Code)\nImport-Module \"$Directory\\SccmDeployment.psm1\" -Force\n\
        Set-SccmLog \"$Directory\\hierarchy-update.log\"\ntry {\n    $result = Enable-SccmEnhancedHttp $env:COMPUTERNAME\
        \ $Code\n    $Ansible.Changed = $result.Changed\n    $Ansible.Result = $result\n} finally { Set-Location\
        \ $env:SystemDrive\\ }\n"
      parameters:
        Directory: '{{ ludus_sccm_work_directory }}'
        Code: '{{ ludus_sccm_sitecode }}'
    when: ludus_sccm_enable_enhanced_http | bool
  - name: Plan the remaining route using the target already selected for this deployment
    mayyhem.ludus_sccm.sccm_version_plan:
      target_version: '{{ ludus_sccm_selected_plan.target_version }}'
      install_hotfixes: '{{ ludus_sccm_install_hotfixes }}'
      current_site_versions: '{{ ludus_sccm_installed_sites.result }}'
      allow_mixed_versions: true
    register: ludus_sccm_remaining_plan
  - name: Install each required release in order
    ansible.builtin.include_tasks: release.yml
    loop: '{{ ludus_sccm_remaining_plan.plan.upgrade_versions }}'
    loop_control:
      loop_var: sccm_release
  - name: Reconcile secondary and passive servers at the selected release
    ansible.builtin.include_tasks: release.yml
    vars:
      sccm_release: '{{ ludus_sccm_selected_plan.target_version }}'
    when: ludus_sccm_remaining_plan.plan.upgrade_versions | length == 0
  - name: Apply applicable registered hotfixes across native restart checkpoints
    ansible.builtin.include_role:
      name: mayyhem.ludus_sccm.sccm_common
      tasks_from: run_phase.yml
      public: true
    vars:
      sccm_phase_name: Apply applicable registered hotfixes
      sccm_phase_script: Update-SccmHotfixes.ps1
      sccm_phase_arguments:
        SiteCode: '{{ ludus_sccm_sitecode }}'
        AllowWarnings: '{{ ludus_sccm_allow_prerequisite_warnings | bool }}'
        TimeoutMinutes: '{{ ludus_sccm_update_timeout_minutes | int }}'
        CatalogSettleSeconds: '{{ ludus_sccm_catalog_settle_seconds | int }}'
    when: ludus_sccm_install_hotfixes | bool
  - name: Explain the disabled additional hotfix policy
    ansible.builtin.debug:
      msg: Additional hotfix installation is disabled. Existing and bundled fixes remain installed.
    when: not (ludus_sccm_install_hotfixes | bool)
  - name: Refresh the servicing console after any hotfix console update
    ansible.builtin.include_tasks: console.yml
  - name: Complete installed components and final verification
    ansible.builtin.include_tasks: completion.yml
  - name: Add requested custom security roles and administrative users
    ansible.builtin.include_tasks: administrators.yml
    when: (ludus_sccm_custom_security_roles | length > 0) or (ludus_sccm_administrative_users | length > 0)
  - name: Set the requested primary users of client devices
    ansible.builtin.include_tasks: primary_users.yml
    when: ludus_sccm_primary_users | length > 0
  always:
  - name: Locate servicing logs and reports even after a failure
    ansible.windows.win_find:
      paths: '{{ ludus_sccm_work_directory }}'
      patterns:
      - '*.log'
      - '*.json'
      recurse: false
    register: ludus_sccm_evidence_files
    ignore_errors: true
  - name: Copy servicing reports to the controller and explain where they are
    ansible.builtin.include_tasks: report.yml
