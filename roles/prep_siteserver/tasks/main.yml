---
# Ensure effective hostnames are set for all templates
- import_tasks: ../tasks/set_effective_hostnames.yml

- name: Install Windows Features
  ansible.windows.win_feature:
    name:
      - BITS
      - BITS-IIS-Ext
      - GPMC
      - NET-Framework-Core
      - NET-Framework-45-Core
      - RDC
      - RSAT
      - Web-WebServer
      - Web-Common-Http
      - Web-Dir-Browsing
      - Web-Http-Errors
      - Web-Static-Content
      - Web-Default-Doc
      - Web-Http-Redirect
      - Web-Mgmt-Tools
      - Web-Mgmt-Console
      - Web-Mgmt-Compat
      - Web-Metabase
      - Web-WMI
      - Web-Windows-Auth
      - Web-ISAPI-Ext
      - Web-Scripting-Tools
      - Web-Mgmt-Service
    state: present

- name: Prepare supported SCCM prerequisites
  ansible.builtin.include_role:
    name: mayyhem.ludus_sccm.prepare_sccm
    public: true
  vars:
    ludus_sccm_prepare_adk: true

- name: Prepare selected installation media
  ansible.builtin.include_tasks: media.yml
  when: ludus_sccm_is_primary_or_cas | default(true) | bool

- name: Write the selected setup configuration
  ansible.windows.win_template:
    src: "{{ ludus_sccm_win_sccm_config_default_template }}"
    dest: 'C:\ludus\sccm\ConfigMgrSetup.ini'
  when: ludus_sccm_is_primary_or_cas | default(true) | bool

- name: Write the directory preparation script
  ansible.windows.win_template:
    src: "{{ ludus_sccm_system_management_template }}"
    dest: 'C:\ludus\sccm\SystemManagement.ps1'
  when: ludus_sccm_is_primary_or_cas | default(true) | bool

- name: Create the SCCM prerequisite download directory
  ansible.windows.win_file:
    path: "{{ ludus_sccm_win_sccm_config_default_prereq_path }}"
    state: directory
