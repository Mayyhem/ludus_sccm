---
ludus_install_directory: /opt/ludus
ludus_sccm_host_path: "C:\\ludus\\sccm"
ludus_sccm_win_sccm_config_default_prereq_path: C:\SCCM
ludus_sccm_system_management_template: SystemManagement.ps1.j2
# Default to standalone primary site with all roles on one server
ludus_sccm_win_sccm_config_default_template: StandaloneSiteConfigMgrSetup.ini.j2
ludus_sccm_sitecode: "PS1"
ludus_sccm_sitename: "Primary Site One"
ludus_sccm_site_server_hostname: "{{ inventory_hostname }}"
ludus_sccm_sql_server_hostname: "{{ inventory_hostname }}"
ludus_sccm_mgmt_server_hostname: "{{ inventory_hostname }}"
ludus_sccm_distro_server_hostname: "{{ inventory_hostname }}"
ludus_sccm_parent_site_server_hostname: "{{ inventory_hostname }}"
ludus_sccm_child_site_server_hostname: "{{ inventory_hostname }}"
ludus_sccm_scp_hostname: "{{ inventory_hostname }}"
